# 1. API Server Block
server {
    server_name api.shopzenventures.shop;

    # Allow larger file uploads (e.g., bulk uploads, images)
    client_max_body_size 100M;

    # Serve uploaded files directly for better performance
    location /uploads/ {
        alias /var/www/shopzen/shopzen/backend/uploads/;
        access_log off;
        expires max;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shopzenventures.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shopzenventures.shop/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# 2. Frontend Server Block (Main Site & Admin)
server {
    server_name shopzenventures.shop www.shopzenventures.shop admin.shopzenventures.shop;

    root /var/www/shopzen/shopzen/dist;
    index index.html;

    # This ensures React Router handles the navigation properly
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shopzenventures.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shopzenventures.shop/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = admin.shopzenventures.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.shopzenventures.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = shopzenventures.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


   listen 80;
    server_name shopzenventures.shop www.shopzenventures.shop admin.shopzenventures.shop;
    return 404; # managed by Certbot
}

server {
    if ($host = api.shopzenventures.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.shopzenventures.shop;
    return 404; # managed by Certbot
}
